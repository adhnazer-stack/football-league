<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="100%" style="stop-color:#0d1535"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#ffe680"/>
      <stop offset="100%" style="stop-color:#c9963c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <rect width="192" height="192" rx="40" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.6"/>
  <!-- Trophy cup -->
  <g filter="url(#glow)" transform="translate(96,88)">
    <!-- Cup body -->
    <path d="M-28,-32 C-28,-32 -32,0 -24,18 C-18,32 0,38 0,38 C0,38 18,32 24,18 C32,0 28,-32 28,-32 Z" fill="url(#gold)"/>
    <!-- Handles -->
    <path d="M-28,-20 C-46,-20 -46,8 -28,8" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
    <path d="M28,-20 C46,-20 46,8 28,8" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
    <!-- Base stem -->
    <rect x="-8" y="38" width="16" height="10" fill="url(#gold)" rx="2"/>
    <!-- Base plate -->
    <rect x="-22" y="48" width="44" height="7" fill="url(#gold)" rx="3"/>
    <!-- Star on cup -->
    <polygon points="0,-18 3,-10 11,-10 5,-5 7,3 0,-2 -7,3 -5,-5 -11,-10 -3,-10" fill="#fff" opacity="0.9" transform="scale(0.9)"/>
  </g>
  <!-- Football at bottom right -->
  <circle cx="148" cy="148" r="18" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.5"/>
  <text x="148" y="155" text-anchor="middle" font-size="20">⚽</text>
</svg>
